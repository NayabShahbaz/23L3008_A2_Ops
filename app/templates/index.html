{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<section class="card">
  <h1>Is this image AI-generated?</h1>
  <p class="muted">Upload a JPG, PNG, BMP, GIF or WEBP image (max {{ max_mb }} MB). The image is analysed in memory and is not stored.</p>
  <form action="{{ url_for('main.predict') }}" method="post" enctype="multipart/form-data" class="upload">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Analyse image</button>
  </form>
</section>
{% endblock %}
