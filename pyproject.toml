[project]
name = "visionguard"
version = "0.1.0"
description = "23L3008_A2_Ops - AI vs Real image classification and deployment"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["labs", "notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
